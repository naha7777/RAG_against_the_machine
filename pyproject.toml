[project]
name = "RAG-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]
authors = [
	{name = "anacharp", email = "anacharp@student.42lehavre.fr"}
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
